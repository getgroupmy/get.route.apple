# Runs the tests and builds the Docker image on every push and pull request.
# Nothing here contacts DuckDuckGo or Apple: the browser tests use a local
# fake page, and the image check only starts Chromium inside the container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          REQUIRE_CHROMIUM: "1"   # fail, don't skip, if Chromium can't start
          NO_PROXY: 127.0.0.1,localhost
        run: python -m unittest -v test_guard.py test_apple_maps.py test_api.py test_browser.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the NAS compose file
        working-directory: deploy/nas
        env:
          ROUTE_API_KEY: ci
          GET_ROUTE_NETWORK: ci-network
        run: docker compose config --quiet

      - name: Build the image
        run: docker build --platform linux/amd64 -t get-route-apple:ci .

      - name: Start it and check Chromium opens
        run: |
          docker run -d --name apple --shm-size=512m -p 8000:8000 \
            -e ROUTE_API_KEY=ci -e WARM_ON_START=1 get-route-apple:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS -H "X-Route-Key: ci" http://127.0.0.1:8000/health || true)
            if echo "$body" | jq -e '.status == "ok" and .browser.open == true' >/dev/null 2>&1; then
              echo "$body" | jq .
              exit 0
            fi
            sleep 2
          done
          echo "Chromium did not open within 60 s. Last /health: $body"
          docker logs apple
          exit 1

      - name: Check the key is required
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/routes/search?from=1,2&to=3,4")
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs apple || true
