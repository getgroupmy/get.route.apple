# Runs the tests and builds the Docker image on every push and pull request.
# Nothing here calls Apple: the tests use a fake Apple Maps Server API with a
# throwaway signing key, and the image check runs without an Apple key.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest -v test_guard.py test_apple_maps.py test_auth.py test_api.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the NAS compose file
        working-directory: deploy/nas
        env:
          ROUTE_API_KEY: ci
          GET_ROUTE_NETWORK: ci-network
          APPLE_TEAM_ID: TEAM123456
          APPLE_MAPS_KEY_ID: KEY1234567
        run: docker compose config --quiet

      - name: Build the image
        run: docker build -t get-route-apple:ci .

      - name: Start it without an Apple key and check it answers
        run: |
          docker run -d --name apple -p 8000:8000 -e ROUTE_API_KEY=ci get-route-apple:ci
          for i in $(seq 1 20); do
            body=$(curl -fsS -H "X-Route-Key: ci" http://127.0.0.1:8000/health || true)
            if echo "$body" | jq -e '.status == "ok" and .apple_key_configured == false' >/dev/null 2>&1; then
              echo "$body" | jq .
              exit 0
            fi
            sleep 1
          done
          echo "No healthy answer within 20 s. Last /health: $body"
          exit 1

      - name: Check the key is required, and a missing Apple key is reported
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/routes/search?from=1,2&to=3,4")
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          body=$(curl -s -H "X-Route-Key: ci" "http://127.0.0.1:8000/routes/search?from=1,2&to=3,4")
          echo "$body"
          echo "$body" | jq -e '.error | contains("APPLE_TEAM_ID")' >/dev/null

      - name: Container logs
        if: always()
        run: docker logs apple || true
