# The Apple Maps route API on the office Mac mini (see README.md): the
# PRIMARY Apple Maps server. The NAS runs the same service as the backup.
#
#   apple-mac.getride.my -> http://get-route-apple:8000   needs X-Route-Key
#
# GET.ride's Fare AI lists both servers in order (Waze, then this Mac, then
# the NAS) and moves to the next one when a server fails, so the NAS answers
# only while the Mac is off, asleep or failing.
#
# The Mac has its own Cloudflare Tunnel (the cloudflared service below), so
# it works without the NAS: no port is opened on the Mac or the router.
#
# Works on Apple Silicon and Intel Macs (the image is plain Python).

name: get-route-apple

services:
  get-route-apple:
    build: ../..
    image: get-route-apple:2
    container_name: get-route-apple
    restart: unless-stopped
    environment:
      PORT: "8000"
      ROUTE_API_KEY: ${ROUTE_API_KEY:?Set ROUTE_API_KEY in .env (the same key as on the NAS)}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in .env (Apple Developer > Membership details)}
      APPLE_MAPS_KEY_ID: ${APPLE_MAPS_KEY_ID:?Set APPLE_MAPS_KEY_ID in .env (Apple Developer > Keys)}
      APPLE_MAPS_KEY_FILE: /run/secrets/apple_maps.p8
      SEARCH_LOCATION: ${SEARCH_LOCATION:-}
      LANGUAGE: ${LANGUAGE:-en-US}
      CACHE_SECONDS: ${CACHE_SECONDS:-1800}
      STALE_SECONDS: ${STALE_SECONDS:-21600}
      # Apple's 25,000 calls a day are shared by the whole Apple Developer
      # team: this Mac's cap plus the NAS's cap must stay under 25,000.
      DAILY_LIMIT: ${DAILY_LIMIT:-20000}
      MAX_PER_MINUTE: ${MAX_PER_MINUTE:-20}
      QUOTA_PAUSE: ${QUOTA_PAUSE:-900}
    # Only on the Mac itself (http://localhost:8085), for checks.
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8085}:8000"
    volumes:
      # The same Apple Maps key as on the NAS, renamed apple_maps.p8. Read-only.
      - ./secrets:/run/secrets:ro
    mem_limit: ${MEM_LIMIT:-256m}

  # The Mac's own Cloudflare Tunnel: apple-mac.getride.my -> get-route-apple:8000.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: get-route-apple-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (Cloudflare Zero Trust > Tunnels > Create a tunnel)}
    depends_on:
      - get-route-apple
    mem_limit: 256m
