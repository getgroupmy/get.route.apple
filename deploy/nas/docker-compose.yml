# GET.route Apple Maps on the office NAS (see README.md): the second Apple
# Maps server. One small container, reached through GET.route's Cloudflare
# Tunnel, with its own console at /admin:
#
#   applemap2.getcdn.link -> http://get-route-apple:8000   (an app's key in X-Route-Key)
#
# (applemap.getcdn.link is the same service on the Mac mini, deploy/mac.)
#
# It joins GET.route's Docker network (GET_ROUTE_NETWORK in .env), so
# GET.route's cloudflared reaches it by name.

# A fixed project name. GET.route's compose files also live in folders called
# deploy/nas; without this, both would be the project "nas".
name: get-route-apple

services:
  get-route-apple:
    build: ../..
    image: get-route-apple:3
    container_name: get-route-apple
    restart: unless-stopped
    environment:
      PORT: "8000"
      # The console at /admin: the owner's way in (24+ characters). Without it
      # the console is closed; the API still answers apps with their keys.
      APPLEMAP_ADMIN_TOKEN: ${APPLEMAP_ADMIN_TOKEN:-}
      APPLEMAP_PUBLIC_URL: ${APPLEMAP_PUBLIC_URL:-https://applemap2.getcdn.link}
      APPLEMAP_DATA_DIR: /data
      # Optional: the old single key, kept working as an app until callers move.
      ROUTE_API_KEY: ${ROUTE_API_KEY:-}
      # Apple Developer: Team ID, and the Key ID of the Maps key in ./secrets.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in .env (Apple Developer > Membership details)}
      APPLE_MAPS_KEY_ID: ${APPLE_MAPS_KEY_ID:?Set APPLE_MAPS_KEY_ID in .env (Apple Developer > Keys)}
      APPLE_MAPS_KEY_FILE: /run/secrets/apple_maps.p8
      SEARCH_LOCATION: ${SEARCH_LOCATION:-}
      LANGUAGE: ${LANGUAGE:-en-US}
      # Starting values only: the console's Settings change them.
      DAILY_LIMIT: ${DAILY_LIMIT:-24000}
      MAX_PER_MINUTE: ${MAX_PER_MINUTE:-20}
      CACHE_SECONDS: ${CACHE_SECONDS:-1800}
      STALE_SECONDS: ${STALE_SECONDS:-21600}
    expose:
      - "8000"
    # Also on the NAS's own address (http://NAS_IP:8085) for the office LAN.
    # No port is opened on the router. Remove these two lines to allow only the tunnel.
    ports:
      - "${LAN_PORT:-8085}:8000"
    volumes:
      # The Apple Maps key (AuthKey_XXXXXXXXXX.p8, renamed apple_maps.p8). Read-only.
      - ./secrets:/run/secrets:ro
      # The database: apps and their key hashes, console users, settings, the
      # request log and the audit trail. Back it up with the NAS's other backups.
      - ./data:/data
    networks:
      - default
      - get-route
    mem_limit: ${MEM_LIMIT:-256m}

  # Only with --profile own-tunnel (when GET.route's tunnel isn't used).
  cloudflared:
    profiles: ["own-tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    container_name: get-route-apple-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # set in .env when using --profile own-tunnel
    depends_on:
      - get-route-apple
    mem_limit: 256m

networks:
  # GET.route's network, where its cloudflared runs. Its NAME (not its ID):
  #   sudo docker inspect get-route-tunnel --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  get-route:
    external: true
    name: ${GET_ROUTE_NETWORK:?Set GET_ROUTE_NETWORK in .env (GET.route's Docker network name)}
