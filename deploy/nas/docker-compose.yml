# The Apple Maps route API on the office NAS (see README.md), set up the same
# way as GET.route and the Traffic Scraper: one small container, reached
# through GET.route's Cloudflare Tunnel, and on the NAS's LAN address.
#
#   apple.getride.my -> http://get-route-apple:8000   needs X-Route-Key
#
# Answers come from Apple's official Maps Server API, signed with your Apple
# Developer team's Maps key: put the key's .p8 file in ./secrets/ as
# apple_maps.p8 and its Team ID and Key ID in .env.
#
# By default it joins GET.route's Docker network (GET_ROUTE_NETWORK in .env),
# so GET.route's cloudflared can reach it by name. Without GET.route, start
# it with its own tunnel instead (see README.md, "Its own tunnel").

# A fixed project name. GET.route's and the Traffic Scraper's compose files
# also live in folders called deploy/nas; without this, all would be the
# project "nas" and commands here could stop their containers.
name: get-route-apple

services:
  get-route-apple:
    build: ../..
    image: get-route-apple:2
    container_name: get-route-apple
    restart: unless-stopped
    environment:
      PORT: "8000"
      ROUTE_API_KEY: ${ROUTE_API_KEY:?Set ROUTE_API_KEY in .env (openssl rand -hex 32)}
      # Apple Developer: Team ID, and the Key ID of the Maps key in ./secrets.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in .env (Apple Developer > Membership details)}
      APPLE_MAPS_KEY_ID: ${APPLE_MAPS_KEY_ID:?Set APPLE_MAPS_KEY_ID in .env (Apple Developer > Keys)}
      APPLE_MAPS_KEY_FILE: /run/secrets/apple_maps.p8
      # Place names are looked up near here (empty = anywhere).
      SEARCH_LOCATION: ${SEARCH_LOCATION:-}
      LANGUAGE: ${LANGUAGE:-en-US}
      # Apple allows 25,000 calls a day; repeats come from memory (30 min),
      # and older answers are used while the quota is used up.
      CACHE_SECONDS: ${CACHE_SECONDS:-1800}
      STALE_SECONDS: ${STALE_SECONDS:-21600}
      DAILY_LIMIT: ${DAILY_LIMIT:-24000}
      MAX_PER_MINUTE: ${MAX_PER_MINUTE:-0}
      QUOTA_PAUSE: ${QUOTA_PAUSE:-900}
    expose:
      - "8000"
    # Also on the NAS's own address (http://NAS_IP:8085) for apps on the
    # office LAN. This opens no port on the router. Set LAN_PORT in .env;
    # remove these two lines if only the tunnel should reach it.
    ports:
      - "${LAN_PORT:-8085}:8000"
    volumes:
      # The Apple Maps key (AuthKey_XXXXXXXXXX.p8, renamed apple_maps.p8). Read-only.
      - ./secrets:/run/secrets:ro
    networks:
      - default
      - get-route
    mem_limit: ${MEM_LIMIT:-256m}

  # Only with --profile own-tunnel (when GET.route's tunnel isn't used).
  cloudflared:
    profiles: ["own-tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    container_name: get-route-apple-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # set in .env when using --profile own-tunnel
    depends_on:
      - get-route-apple
    mem_limit: 256m

networks:
  # GET.route's network, where its cloudflared runs. Its NAME (not its ID):
  #   sudo docker inspect get-route-tunnel --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  get-route:
    external: true
    name: ${GET_ROUTE_NETWORK:?Set GET_ROUTE_NETWORK in .env (GET.route's Docker network name)}
